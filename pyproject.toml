[project]
name = "incident-investigator"
version = "0.1.0"
description = "Multi-agent production incident investigation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15,<2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27,<1",
    "rich>=15,<16",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
investigator = "investigator.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Anthropic API and costs money"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/investigator"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
